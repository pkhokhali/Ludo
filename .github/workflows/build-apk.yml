name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build debug APK (sideload testing)
        # Debug APK avoids release-only AdMob/WorkManager startup crashes on AGP 9.
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Package APKs
        run: |
          mkdir -p dist
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr '+' '_')
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/LudoArena-${VERSION}-debug.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/LudoArena-${VERSION}-release.apk"
          ls -lh dist/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LudoArena-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
